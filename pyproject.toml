[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: hits live external APIs; requires MAPS_API_KEY / NPS_API_KEY in .env",
]
# Unit tests only by default; run `pytest -m integration` for the live suite.
addopts = "-m 'not integration'"
