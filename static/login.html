<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yellowstone Trip Agent — Sign in</title>
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; margin: 0; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(160deg, #1b3a2f 0%, #0e2231 100%); color: #eef2f0;
        }
        .card {
            width: min(92vw, 380px); padding: 2.2rem 2rem; border-radius: 14px;
            background: rgba(255, 255, 255, 0.07); backdrop-filter: blur(6px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
        }
        h1 { font-size: 1.25rem; margin-bottom: 0.4rem; }
        p  { font-size: 0.9rem; opacity: 0.75; margin-bottom: 1.4rem; }
        input[type=password] {
            width: 100%; padding: 0.7rem 0.9rem; border-radius: 8px; border: 1px solid #4a6a5e;
            background: rgba(0,0,0,0.25); color: inherit; font-size: 1rem;
        }
        button {
            width: 100%; margin-top: 1rem; padding: 0.7rem; border: 0; border-radius: 8px;
            background: #2f9e6e; color: white; font-size: 1rem; font-weight: 600; cursor: pointer;
        }
        button:hover { background: #37b57e; }
        .error { color: #ff9d9d; font-size: 0.85rem; margin-top: 0.8rem; min-height: 1.1em; }
    </style>
</head>
<body>
    <form class="card" id="login-form" autocomplete="off">
        <h1>🏔️ Yellowstone Trip Agent</h1>
        <p>Enter your family password to continue.</p>
        <input type="password" id="password" placeholder="Family password" autofocus required>
        <button type="submit">Sign in</button>
        <div class="error" id="error"></div>
    </form>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorEl = document.getElementById('error');
            errorEl.textContent = '';
            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: document.getElementById('password').value }),
            });
            if (res.ok) {
                window.location.href = '/ui/';
            } else {
                errorEl.textContent = 'Wrong password — ask Family 1 for yours.';
            }
        });
    </script>
</body>
</html>
